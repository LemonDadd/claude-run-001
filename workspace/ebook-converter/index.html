<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>电子书格式转换器</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📖 电子书转换器</h1>
      <button id="historyBtn" class="icon-btn" aria-label="历史记录" title="历史记录">
        历史
      </button>
    </header>

    <main id="screen" class="screen">
      <!-- 由 main.ts 渲染各步骤 -->
    </main>
  </div>

  <!-- 历史记录抽屉 -->
  <div id="historyDrawer" class="drawer" hidden>
    <div class="drawer-mask" data-close-drawer></div>
    <aside class="drawer-panel" role="dialog" aria-label="转换历史">
      <div class="drawer-head">
        <h2>转换历史</h2>
        <button id="clearHistoryBtn" class="text-btn danger">清空</button>
        <button class="icon-btn" data-close-drawer aria-label="关闭">✕</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
